# Android APK (Phase 6), built on GitHub's runner because the dev laptop has 5.8 GB
# of RAM. Runs when the mobile app changes; the APK is an artifact of the run
# (docs/setup-android.md, "APK from CI").
#
# With the signing secrets (TZ 1.38) the APK is a release build signed with the one fixed
# upload key, so a new APK installs over the old one; the step checks the signature against
# the key's fingerprint. Without them (before the user adds them) it is a debug build with
# the runner's throwaway key, and testers uninstall before each update. Secrets:
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD (docs/setup-android.md).

name: android

on:
  push:
    branches: ["**"]
    paths:
      - "apps/mobile/**"
      - "apps/web/src/styles/tokens.css" # tokens_test.dart reads it
      - "apps/web/src/i18n/*.ts" # i18n_test.dart reads them
      - "packages/shared/traits.json" # traits_test.dart reads it
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # The live API (docs/deploy.md). Passed with --dart-define, never written into code.
      API_URL: https://movie-match-api-mgdn.onrender.com
      # Supabase project URL and anon key: public values, kept as repository variables
      # (Settings → Secrets and variables → Actions → Variables), not in git. Without them
      # the app builds and says sign-in is not set up.
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      # The upload certificate's SHA-256 (public; keytool -list -v). A release APK signed
      # with any other key fails the run.
      UPLOAD_CERT_SHA256: 8d72c8e550672a22530637f2ec0b09386f350bfab7e5cac7757bae05c7b02642

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The same release as the local install in C:\Users\User\develop\flutter.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # The phase gate: zero issues, not just zero errors (docs/prompts/phase-06-mobile.md).
      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      - name: Sign-in settings present
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_ANON_KEY variables are not set: the APK will say sign-in is unavailable"
          fi

      # The key file and key.properties live in the runner's temp space and android/
      # (gitignored) for this job only; the passwords never reach the log.
      - name: Release signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::No signing secrets: building the debug APK"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=upload"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/key.properties
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: flutter build apk --release
        if: steps.key.outputs.release == 'true'
        run: |
          flutter build apk --release --dart-define=API_URL="$API_URL" --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          got=$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          echo "signed with $got"
          test "$got" = "$UPLOAD_CERT_SHA256"

      - name: flutter build apk --debug
        if: steps.key.outputs.release != 'true'
        run: |
          flutter build apk --debug --dart-define=API_URL="$API_URL" --dart-define=SUPABASE_URL="$SUPABASE_URL" --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.release == 'true'
        with:
          name: movie-match-${{ github.sha }}
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.release != 'true'
        with:
          name: movie-match-debug-${{ github.sha }}
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/key.properties
