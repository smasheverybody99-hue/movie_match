# Android debug APK (Phase 6), built on GitHub's runner because the dev laptop has 5.8 GB
# of RAM. Runs when the mobile app changes; the APK is an artifact of the run
# (docs/setup-android.md, "APK from CI").
#
# Debug-signed with the runner's own throwaway debug key, so every run's APK has a
# different signature: uninstall the previous build on the phone before installing a new
# one. No secrets are used. The Play build (release-signed AAB) is a separate job, later.

name: android

on:
  push:
    branches: ["**"]
    paths:
      - "apps/mobile/**"
      - "apps/web/src/styles/tokens.css" # tokens_test.dart reads it
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # The live API (docs/deploy.md). Passed with --dart-define, never written into code.
      API_URL: https://movie-match-api-mgdn.onrender.com

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The same release as the local install in C:\Users\User\develop\flutter.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # The phase gate: zero issues, not just zero errors (docs/prompts/phase-06-mobile.md).
      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      - name: flutter build apk --debug
        run: flutter build apk --debug --dart-define=API_URL="$API_URL"

      - uses: actions/upload-artifact@v4
        with:
          name: movie-match-debug-${{ github.sha }}
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error
